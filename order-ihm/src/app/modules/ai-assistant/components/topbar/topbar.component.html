<!-- Top Bar Template -->

<mat-toolbar class="ai-topbar">
  <!-- Left Section: Menu & Title -->
  <div class="topbar-left">
    <button mat-icon-button (click)="toggleSidebar()" matTooltip="Toggle sidebar" class="menu-btn">
      <mat-icon>menu</mat-icon>
    </button>

    <h1 class="topbar-title">
      {{ currentConversation?.title || 'AI Assistant' }}
    </h1>
  </div>

  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- Right Section: Actions -->
  <div class="topbar-right">
    <!-- Share Button -->
    <button
      mat-icon-button
      (click)="shareConversation()"
      [disabled]="!currentConversation"
      matTooltip="Share conversation"
    >
      <mat-icon>share</mat-icon>
    </button>

    <!-- More Options Menu -->
    <button mat-icon-button [matMenuTriggerFor]="menu" matTooltip="More options">
      <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="exportConversation()">
        <mat-icon>download</mat-icon>
        <span>Export conversation</span>
      </button>
      <button mat-menu-item>
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </button>
      <button mat-menu-item>
        <mat-icon>help</mat-icon>
        <span>Help & feedback</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
