<mat-card *ngIf="order">
  <mat-card-title>Update Order {{order.id}}</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let s of ['Pending','Confirmed','Processing','Shipped','Delivered','Canceled']" [value]="s">{{s}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Notes</mat-label>
        <textarea matInput formControlName="notes"></textarea>
      </mat-form-field>

      <div class="actions">
        <button mat-flat-button color="primary" (click)="save()">Save</button>
        <button mat-button routerLink="/orders">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
